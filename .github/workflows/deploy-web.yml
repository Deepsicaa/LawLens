name: Deploy Web

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web type-check

      - name: Deploy through the linked Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN for manual deployments}"
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID for manual deployments}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID for manual deployments}"
          npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
