name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Run tests before deploy
        working-directory: apps/api
        run: |
          uv sync --locked --group dev
          uv run pytest tests/ -v
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://lawlens:lawlens@localhost:5432/lawlens_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          : "${RAILWAY_TOKEN:?Set RAILWAY_TOKEN for the lawlens-api Railway production environment}"
          npx --yes @railway/cli@5.75.0 up apps/api --path-as-root --ci --service lawlens-api
