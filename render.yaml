services:
  - type: web
    name: lawlens-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000 --workers 1
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - render.yaml
    envVars:
      - key: PORT
        value: "10000"
      - key: ENV
        value: production
      - key: APP_URL
        value: https://lawlens-legal.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lawlens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lawlens-cache
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      # Set CLERK_WEBHOOK_SECRET after Clerk has the public Render endpoint.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
  - type: keyvalue
    name: lawlens-cache
    plan: free
    ipAllowList: []

databases:
  - name: lawlens-db
    plan: free
    ipAllowList: []
